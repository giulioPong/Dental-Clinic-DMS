[package]
name = "dental-clinic-dms"
version = "0.1.0"
description = "Dental Clinic Management System"
authors = ["Dental-Clinic-DMS"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dental_clinic_dms_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
aes-gcm = { version = "0.10", features = ["stream", "zeroize"] }
uuid = { version = "1", features = ["v4"] }
argon2 = "0.5"
hkdf = "0.12"
sha2 = "0.10"
hmac = "0.12"
zeroize = "1"
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl", "backup"] }
zip = { version = "0.6", default-features = false, features = ["deflate"] }
tauri-plugin-dialog = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 3


[dev-dependencies]
serde_json = "1"
